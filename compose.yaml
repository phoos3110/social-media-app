services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: ./server/.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 4180
      NODE_ENV: production
      COOKIE_SECURE: "false"
      TRUST_PROXY_HOPS: "1"
      CLIENT_ORIGIN: http://localhost:5180,http://127.0.0.1:5180
      DATABASE_URL: postgresql://social:${POSTGRES_PASSWORD:-social_local_password}@postgres:5432/social
    volumes:
      - ./server/uploads:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
